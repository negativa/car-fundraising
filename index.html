<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Збір на мінівен для служіння</title>
  <link rel="stylesheet" href="css/style.css?v=1.0.1" />
</head>
<body x-data="fundraiserPage()" x-init="init()" :class="theme === 'dark' ? 'theme-dark' : 'theme-light'">
  <div class="shell">
    <div class="page-card">
      <header class="site-header">
        <a class="brand" href="#" aria-label="Pidhaine Ministry">
          <span class="brand-mark" x-text="text('logoSymbol','✝')"></span>
          <span class="brand-name" x-text="text('siteName','Pidhaine Ministry')"></span>
        </a>
        <div class="header-actions">
          <div class="lang-switch" aria-label="Language switcher">
            <button type="button" :class="{active: lang === 'ua'}" @click="setLang('ua')">UA</button>
            <button type="button" :class="{active: lang === 'en'}" @click="setLang('en')">EN</button>
          </div>

          <button class="theme-toggle" type="button" @click="toggleTheme()" :aria-label="ui('themeToggle')">
            <span x-text="theme === 'dark' ? '☀' : '☾'"></span>
          </button>
          <button class="menu-btn" type="button" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-copy">
          <div class="kicker" x-text="text('heroKicker', ui('heroKicker'))"></div>
          <h1 x-text="text('header','Збір на мінівен для сімʼї та служіння')"></h1>
          <p x-text="text('paragraph','Старий мікроавтобус багато років возив дітей, команду, допомогу та людей. Тепер через критичну корозію й постійні поломки він став ризиком у дорозі.')"></p>
        </div>
      </section>

      <section class="overview-grid">
        <div class="overview-main panel">
          <div class="panel-head">
            <h2 x-text="ui('donationsTitle')"></h2>
          </div>

          <div class="status" x-show="loading" x-cloak x-text="ui('loading')"></div>
          <div class="error" x-show="error" x-text="error" x-cloak></div>

          <div class="table-wrap" x-show="!loading && recentDonations.length" x-cloak>
            <table class="donation-table">
              <thead>
                <tr>
                  <th x-text="ui('dateLabel')"></th>
                  <th x-text="ui('amountLabel')"></th>
                  <th x-text="ui('sourceLabel')"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="d in recentDonations" :key="`${d.date}-${d.amount}-${d.source}`">
                  <tr>
                    <td x-text="d.date"></td>
                    <td class="amount-cell" x-text="formatNumber(d.amount)"></td>
                    <td x-text="d.source"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

        </div>

        <aside class="overview-side panel">
          <div class="ring-wrap">
            <div class="ring" :style="`--p:${progress}`">
              <div class="ring-center">
                <div class="ring-value"><span x-text="progress"></span>%</div>
                <div class="ring-label" x-text="ui('progressLabel')"></div>
              </div>
            </div>
          </div>

          <div class="stats-grid">
            <div>
              <div class="stat-big" x-text="formatMoney(totalRaised)"></div>
              <div class="stat-sub" x-text="ui('raisedLabel')"></div>
            </div>
            <div>
              <div class="stat-big goal-big" x-text="formatMoney(goal)"></div>
              <div class="stat-sub stat-goal" x-text="ui('goalLabel')"></div>
            </div>
          </div>

          <div class="side-divider"></div>

          <div class="donor-block">
            <div class="donor-big" x-text="donorCount"></div>
            <div class="stat-sub" x-text="ui('donorsLabel')"></div>
          </div>

          <div class="btn-stack">
            <a class="btn btn-primary" :href="text('donateLink','#donate')" x-text="ui('donateButton')"></a>
            <button class="btn btn-outline" type="button" @click="sharePage()" x-text="ui('shareButton')"></button>
          </div>
        </aside>
      </section>

      <section class="payment-options" id="donate">
                  <div class="payment-head">
                    <h2 x-text="ui('paymentTitle')"></h2>
                    <p x-text="ui('paymentSubtitle')"></p>
                  </div>
      
                  <div class="payment-grid">
                    <article class="payment-card">
                      <div class="payment-icon">●</div>
                      <div>
                        <h3 x-text="text('monotitle', ui('monoTitle'))"></h3>
                        <p x-text="text('monodetails', ui('monoDetails'))"></p>
                      </div>
                    </article>
      
                    <article class="payment-card">
                      <div class="payment-icon">P</div>
                      <div>
                        <h3 x-text="text('paypaltitle', ui('paypalTitle'))"></h3>
                        <p x-text="text('paypaldetails', ui('paypalDetails'))"></p>
                      </div>
                    </article>
      
                    <article class="payment-card">
                      <div class="payment-icon">€</div>
                      <div>
                        <h3 x-text="text('sepatitle', ui('sepaTitle'))"></h3>
                        <p x-text="text('sepadetails', ui('sepaDetails'))"></p>
                      </div>
                    </article>
      
                    <article class="payment-card">
                      <div class="payment-icon">$</div>
                      <div>
                        <h3 x-text="text('swifttitle', ui('swiftTitle'))"></h3>
                        <p x-text="text('swiftdetails', ui('swiftDetails'))"></p>
                      </div>
                    </article>
                  </div>
                </section>

      <section class="old-minivan-gallery panel-full" x-init="setGalleryImages(['assets/old-minivan/old-minivan-01.jpg','assets/old-minivan/old-minivan-02.jpg','assets/old-minivan/old-minivan-03.jpg','assets/old-minivan/old-minivan-04.jpg','assets/old-minivan/old-minivan-05.jpg','assets/old-minivan/old-minivan-06.jpg','assets/old-minivan/old-minivan-07.jpg','assets/old-minivan/old-minivan-08.jpg','assets/old-minivan/old-minivan-09.jpg','assets/old-minivan/old-minivan-10.jpg','assets/old-minivan/old-minivan-11.jpg','assets/old-minivan/old-minivan-12.jpg','assets/old-minivan/old-minivan-13.jpg','assets/old-minivan/old-minivan-14.jpg','assets/old-minivan/old-minivan-15.jpg','assets/old-minivan/old-minivan-16.jpg','assets/old-minivan/old-minivan-17.jpg'])">
        <div class="gallery-head">
          <div>
            <div class="kicker-dark" x-text="text('galleryKicker', ui('galleryKicker'))"></div>
            <h2 x-text="text('galleryTitle', ui('galleryTitle'))"></h2>
            <p class="section-desc" x-text="text('gallerySubtitle', ui('gallerySubtitle'))"></p>
          </div>
        </div>

        <div class="gallery-grid">
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-01.jpg')">
              <img src="assets/old-minivan/old-minivan-01.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-02.jpg')">
              <img src="assets/old-minivan/old-minivan-02.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-03.jpg')">
              <img src="assets/old-minivan/old-minivan-03.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-04.jpg')">
              <img src="assets/old-minivan/old-minivan-04.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-05.jpg')">
              <img src="assets/old-minivan/old-minivan-05.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-06.jpg')">
              <img src="assets/old-minivan/old-minivan-06.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-07.jpg')">
              <img src="assets/old-minivan/old-minivan-07.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-08.jpg')">
              <img src="assets/old-minivan/old-minivan-08.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-09.jpg')">
              <img src="assets/old-minivan/old-minivan-09.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-10.jpg')">
              <img src="assets/old-minivan/old-minivan-10.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-11.jpg')">
              <img src="assets/old-minivan/old-minivan-11.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-12.jpg')">
              <img src="assets/old-minivan/old-minivan-12.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-13.jpg')">
              <img src="assets/old-minivan/old-minivan-13.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-14.jpg')">
              <img src="assets/old-minivan/old-minivan-14.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-15.jpg')">
              <img src="assets/old-minivan/old-minivan-15.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-16.jpg')">
              <img src="assets/old-minivan/old-minivan-16.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
            <button class="gallery-item" type="button" @click="openGalleryImage('assets/old-minivan/old-minivan-17.jpg')">
              <img src="assets/old-minivan/old-minivan-17.jpg" alt="Старий мінівен у служінні" loading="lazy" />
            </button>
        </div>
      </section>
      <div class="gallery-lightbox" x-show="galleryImage" x-cloak @click.self="closeGalleryImage()" @keydown.escape.window="closeGalleryImage()" @keydown.arrow-left.window="prevGalleryImage()" @keydown.arrow-right.window="nextGalleryImage()">
        <button class="gallery-close" type="button" @click="closeGalleryImage()" :aria-label="ui('closeLabel')">×</button>

        <button class="gallery-nav gallery-prev" type="button" @click.stop="prevGalleryImage()" :aria-label="ui('prevPhoto')">‹</button>

        <img :src="galleryImage" alt="Фото старого мінівена" />

        <button class="gallery-nav gallery-next" type="button" @click.stop="nextGalleryImage()" :aria-label="ui('nextPhoto')">›</button>

        <div class="gallery-counter">
          <span x-text="galleryIndex + 1"></span>/<span x-text="galleryImages.length"></span>
        </div>
      </div>
      <section class="info-section panel panel-full">
        <h2 x-text="content.need.title || text('needTitle','Для чого потрібен новий автомобіль?')"></h2>
        <p class="section-desc" x-text="content.need.desc || text('needDesc','Надійний транспорт потрібен не для зручності, а для того, щоб служіння могло продовжуватися без зривів і ризику на дорозі.')"></p>
        <ul class="bullets bullets-green" x-show="content.need.items.length" x-cloak>
          <template x-for="item in content.need.items" :key="item">
            <li x-text="item"></li>
          </template>
        </ul>
      </section>

      <section class="info-section panel panel-full">
        <h2 x-text="content.risk.title || text('riskTitle','Чому старий вже небезпечний')"></h2>
        <p class="section-desc" x-text="content.risk.desc || text('riskDesc','Стан авто вже не дозволяє покладатися на нього для регулярних поїздок.')"></p>
        <ul class="bullets bullets-red" x-show="content.risk.items.length" x-cloak>
          <template x-for="item in content.risk.items" :key="item">
            <li x-text="item"></li>
          </template>
        </ul>
      </section>

      <section class="family-section panel panel-full">
        <div class="family-photo-wrap">
          <img class="family-photo" src="assets/family.jpg" alt="Наша сімʼя" />
        </div>
        <div class="family-content">
          <div class="kicker-dark" x-text="text('familyKicker', ui('familyKicker'))"></div>
          <h2 x-text="text('familyTitle', ui('familyTitle'))"></h2>
          <p class="section-desc" x-text="text('family','Ми дякуємо за вашу підтримку, молитви та участь у цьому зборі. Для нас цей автомобіль — це можливість безпечніше служити людям і бути поруч там, де є потреба.')"></p>
        </div>
        <div class="thanks-block">
          <span class="thanks-icon">♡</span>
          <span x-text="text('thanks', ui('thanks'))"></span>
        </div>
      </section>
    </div>
  </div>

  <script src="js/main.js?v=1.0.1" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
