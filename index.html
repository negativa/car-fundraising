<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Збір на транспорт</title>
  
  <link rel="stylesheet" href="css/style.css" />
</head>

<body x-data="fundraiserPage()" x-init="init()">
  <div class="shell">
    <div class="card">
      <header class="site-header">
        <a class="brand" href="#" target="_blank" rel="noopener">
          <span class="brand-mark" x-text="text('logoSymbol','†')"></span>
          <span x-text="text('siteName','Pidhaine Ministry')"></span>
        </a>
        <div class="hamburger" aria-label="menu"><span></span><span></span><span></span></div>
      </header>

      <div class="layout">
        <main class="main">
          <section class="hero">
            <div>
              <div class="kicker" x-text="text('heroKicker','Збір на транспорт')"></div>
              <h1 x-text="text('header','Надійний транспорт для великої сімʼї')"></h1>
              <p
                x-text="text('paragraph','Старий мікроавтобус багато років возив дітей, команду, допомогу та людей. Тепер через критичну корозію й постійні поломки він став ризиком у дорозі.')">
              </p>
            </div>
          </section>

          <div class="content">
            <section class="section">
              <h2 x-text="content.need.title || text('needTitle','Для чого потрібен новий автомобіль?')"></h2>
              <p
                x-text="content.need.desc || text('needDesc','Надійний транспорт потрібен не для зручності, а для того, щоб служіння могло продовжуватися без зривів і ризику на дорозі.')">
              </p>
              <ul class="bullets" x-show="content.need.items.length" x-cloak>
                <template x-for="item in content.need.items" :key="item">
                  <li x-text="item"></li>
                </template>
              </ul>
              <div class="thanks">
                <div class="heart">♡</div>
                <div x-text="text('thanks','Дякуємо за вашу підтримку та молитви!')"></div>
              </div>
            </section>

            <section class="section">
              <h2 x-text="content.risk.title || text('riskTitle','Чому старий вже небезпечний')"></h2>
              <p
                x-text="content.risk.desc || text('riskDesc','Стан авто вже не дозволяє покладатися на нього для регулярних поїздок.')">
              </p>
              <ul class="bullets" x-show="content.risk.items.length" x-cloak>
                <template x-for="item in content.risk.items" :key="item">
                  <li x-text="item"></li>
                </template>
              </ul>
            </section>
          </div>

          <section class="donations">
            <div class="donations-head">
              <div>
                <h2 x-text="text('donationsTitle','Останні пожертви')"></h2>
              </div>
            </div>
            <div class="status" x-show="loading" x-cloak>Завантажуємо дані...</div>
            <div class="error" x-show="error" x-text="error" x-cloak></div>
            <div class="table-wrap" x-show="!loading && recentDonations.length" x-cloak>
              <table class="donation-table">
                <thead>
                  <tr>
                    <th>Дата</th>
                    <th>Сума, $</th>
                    <th>Звідки пожертва</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="d in recentDonations" :key="d.date + d.amount + d.source">
                    <tr>
                      <td x-text="d.date"></td>
                      <td x-text="formatNumber(d.amount)"></td>
                      <td x-text="d.source"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </section>
        </main>

        <aside class="aside">
          <div class="aside-inner">
            <div>
              <div class="ring-wrap">
                <div class="ring" :style="`--p:${progress}`"><b><span x-text="progress"></span>%<small
                      x-text="text('progressLabel','зібрано')"></small></b></div>
              </div>
              <div class="money" x-text="formatMoney(totalRaised)"></div>
              <div class="muted" x-text="text('raisedLabel','зібрано')"></div>
              <div class="goal"><span x-text="text('goalLabel','ціль')"></span> <span x-text="formatMoney(goal)"></span>
              </div>
              <div class="divider"></div>
              <div class="donors" x-text="donorCount"></div>
              <div class="muted" x-text="text('donorsLabel','благодійників')"></div>
              <div class="btn-row">
                <a class="btn btn-primary" :href="text('donateLink','#donate')"
                  x-text="text('donateButton','Підтримати збір')"></a>
                <button class="btn btn-outline" @click="sharePage()" x-text="text('shareButton','Поділитися')"></button>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </div>
  <script src="js/main.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>

</html>
